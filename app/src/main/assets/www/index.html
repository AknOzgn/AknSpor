<style>

async function fotmobLeague(leagueId){
  const config=FOTMOB_LEAGUES[leagueId];
  if(!config)throw new Error('Bu lig için puan durumu bulunamadı.');
  const cacheKey=String(config.id);
  const cached=leagueCache.get(cacheKey);
  if(cached&&Date.now()-cached.cachedAt<20_000)return cached.promise;
  {
    const request=(async()=>{
      const data=await fotmobData('data/leagues',`id=${config.id}&ccode3=${config.ccode3}`,'Lig verisi');
      const rows=data.table?.[0]?.data?.table?.all,matches=data.fixtures?.allMatches;
      if(!Array.isArray(rows)||!Array.isArray(matches))throw new Error('Lig verisi beklenen biçimde değil.');
      return{
        standings:rows.map(row=>({rank:row.idx,team:{id:String(row.id),name:row.name,logo:teamLogo(row.id)},all:{played:row.played,win:row.wins,draw:row.draws,lose:row.losses},goalsDiff:row.goalConDiff,points:row.pts,description:''})),
        matches:matches.map(match=>({
          id:String(match.id),round:match.round,roundName:match.roundName,
          home:{id:String(match.home?.id||''),name:match.home?.name||'',logo:teamLogo(match.home?.id)},
          away:{id:String(match.away?.id||''),name:match.away?.name||'',logo:teamLogo(match.away?.id)},
          status:{utcTime:match.status?.utcTime,finished:match.status?.finished,started:match.status?.started,cancelled:match.status?.cancelled,scoreStr:match.status?.scoreStr,reason:{short:match.status?.reason?.short}}
        }))
      };
    })();
    const entry={cachedAt:Date.now(),promise:request};
    leagueCache.set(cacheKey,entry);
    request.catch(()=>{if(leagueCache.get(cacheKey)===entry)leagueCache.delete(cacheKey)});
  }
  return leagueCache.get(cacheKey).promise;
}

function normalizeMatchStatus(value,finished=false,elapsed=null){
  if(finished)return 'FT';
  const status=String(value||'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
  const aliases={'first half':'1H','1st half':'1H','half time':'HT','halftime':'HT','half':'HT',
    'second half':'2H','2nd half':'2H','extra time':'ET','extra time first half':'ET',
    'break':'BT','full time':'FT','fulltime':'FT','finished':'FT','match finished':'FT',
    'after extra time':'AET','penalties':'PEN','penalty shootout':'PEN','not started':'NS',
    'postponed':'PST','cancelled':'CANC','canceled':'CANC','suspended':'SUSP','interrupted':'INT'};
  if(status==='half'||status==='half time'||status==='halftime'||status==='ht'){
    const minute=Number(elapsed);
    if(Number.isFinite(minute)&&minute>=90)return 'FT';
  }
  return aliases[status]||String(value||'').trim().toUpperCase();
}
function normalizeFixtureStatus(fixture){
  const status=fixture?.fixture?.status;

  return {...fixture,fixture:{...fixture.fixture,status:{...status,short:normalizeMatchStatus(status.short,false,status.elapsed)}}};
}
function calculateLiveStandings(rows,matches,completedMatches=[]){
  const live=matches.filter(match=>{
    const status=match.fixture.status.short;
    return LIVE.includes(status)&&!match.detail?.status?.cancelled&&
      match.goals.home!=null&&match.goals.home!==''&&match.goals.away!=null&&match.goals.away!==''&&
      Number.isFinite(Number(match.goals.home))&&Number.isFinite(Number(match.goals.away));
  });
  const completedByTeam=new Map();
  for(const match of completedMatches){
    if(!DONE.includes(match.fixture.status.short))continue;
    for(const team of [match.teams.home,match.teams.away]){
      const key=String(team.id||normalizedTeam(team.name));
      completedByTeam.set(key,(completedByTeam.get(key)||0)+1);
    }
  }
  const liveCountByTeam=new Map();
  for(const match of live){
    for(const team of [match.teams.home,match.teams.away]){
      const key=String(team.id||normalizedTeam(team.name));
      liveCountByTeam.set(key,(liveCountByTeam.get(key)||0)+1);
    }
  }
  const updated=rows.map(row=>({...row,team:{...row.team},all:{...row.all}}));
  for(const match of live){
    const home=updated.find(row=>String(row.team.id)===String(match.teams.home.id)||sameTeam(row.team,match.teams.home));
    const away=updated.find(row=>String(row.team.id)===String(match.teams.away.id)||sameTeam(row.team,match.teams.away));
    if(!home||!away)continue;
    const homeKey=String(home.team.id||normalizedTeam(home.team.name)),awayKey=String(away.team.id||normalizedTeam(away.team.name));
    const homeIncluded=Math.max(0,Number(home.all.played||0)-(completedByTeam.get(homeKey)||0));
    const awayIncluded=Math.max(0,Number(away.all.played||0)-(completedByTeam.get(awayKey)||0));
    if((completedMatches.length&&homeIncluded>=(liveCountByTeam.get(homeKey)||0))||
      (completedMatches.length&&awayIncluded>=(liveCountByTeam.get(awayKey)||0)))continue;
    const goalsHome=Number(match.goals.home),goalsAway=Number(match.goals.away);
    const homeDiff=Number(home.goalsDiff)||0,awayDiff=Number(away.goalsDiff)||0;
    home.all.played=Number(home.all.played||0)+1;away.all.played=Number(away.all.played||0)+1;
    home.goalsDiff=homeDiff+goalsHome-goalsAway;away.goalsDiff=awayDiff+goalsAway-goalsHome;
    if(goalsHome>goalsAway){home.all.win=Number(home.all.win||0)+1;away.all.lose=Number(away.all.lose||0)+1;home.points=Number(home.points||0)+3}
    else if(goalsHome<goalsAway){away.all.win=Number(away.all.win||0)+1;home.all.lose=Number(home.all.lose||0)+1;away.points=Number(away.points||0)+3}
    else{home.all.draw=Number(home.all.draw||0)+1;away.all.draw=Number(away.all.draw||0)+1;home.points=Number(home.points||0)+1;away.points=Number(away.points||0)+1}
  }
  return updated.sort((a,b)=>Number(b.points)-Number(a.points)||Number(b.goalsDiff)-Number(a.goalsDiff)||Number(a.rank)-Number(b.rank))
    .map((row,index)=>({...row,rank:index+1}));
}
function fotmobFixture(match,leagueId){
  if(!match?.home||!match?.away)return null;
  const state=match.status||{},score=String(state.scoreStr||'').match(/(\d+)\s*-\s*(\d+)/);
  const short=state.cancelled?'CANC':state.finished?'FT':state.started?normalizeMatchStatus(state.reason?.short||'LIVE',false,state.elapsed):'NS';
  const league=LG.find(x=>x[0]===leagueId);
  return{
    fixture:{id:'fotmob-'+match.id,date:state.utcTime,status:{short,elapsed:null}},
    league:{id:leagueId,name:league?.[1]||'Futbol',country:'',round:String(match.roundName||match.round||''),logo:''},
    teams:{home:{id:String(match.home.id),name:match.home.name,logo:teamLogo(match.home.id)},away:{id:String(match.away.id),name:match.away.name,logo:teamLogo(match.away.id)}},
    goals:{home:score?Number(score[1]):null,away:score?Number(score[2]):null},
    score:{halftime:{home:null,away:null}},detail:match
  };
}
const seasonForDate=date=>{const d=new Date(date);return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1};
function istanbulDate(value){
  if(!value)return '';
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
  const field=type=>parts.find(part=>part.type===type)?.value||'';
  return `${field('year')}-${field('month')}-${field('day')}`;
}
async function getFx(){
  S.sourceWarning='';
  const allIds=Object.keys(FOTMOB_LEAGUES).map(Number);
  const leagueIds=S.lg?[Number(S.lg)]:allIds;
  const unsupported=leagueIds.filter(id=>!FOTMOB_LEAGUES[id]);
  if(unsupported.length){
    if(S.lg&&HAS_API_KEY){
      const tz='&timezone=Europe/Istanbul';
      return af(S.sub==='l'?'fixtures?live=all'+tz:'fixtures?date='+S.date+tz).then(fixtures=>fixtures.map(normalizeFixtureStatus));
    }
    throw new Error('Bu lig ücretsiz FotMob akışında bulunmuyor. Türkiye 1. Lig ve diğer ek ligler için ayrı API-Sports erişimi gerekir.');
  }
  const results=await Promise.allSettled(leagueIds.map(async id=>{
    const data=await fotmobLeague(id);
    return data.matches.map(match=>fotmobFixture(match,id)).filter(Boolean);
  }));
  const succeeded=results.filter(result=>result.status==='fulfilled');
  const fixtures=succeeded.flatMap(result=>result.value);
  const failed=results.length-succeeded.length;
  S.sourceWarning=failed?`${failed} lig şu anda yüklenemedi.`:'';
  if(!succeeded.length)throw new Error('Maç verileri FotMob’dan alınamadı. İnternet bağlantını kontrol edip tekrar dene.');
  return fixtures.filter(fixture=>S.sub==='l'
    ?LIVE.includes(fixture.fixture.status.short)
    :istanbulDate(fixture.fixture.date)===S.date
  ).map(normalizeFixtureStatus).sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date));
}

async function favoriteGoalFixtures(){
  const favoriteIds=new Set(favoriteTeamIds());
  if(!favoriteIds.size)return [];
  const teams=[...favoriteTeams,...S.fx.flatMap(fixture=>[fixture.teams.home,fixture.teams.away]
    .filter(team=>favoriteIds.has(String(team.id)))
    .map(team=>({id:String(team.id),leagueId:Number(fixture.league.id)})))];
  const leagueIds=[...new Set(teams.map(team=>Number(team.leagueId)).filter(id=>Number.isFinite(id)&&id>0))];
  const supported=leagueIds.filter(id=>FOTMOB_LEAGUES[id]);
  const unsupportedTeamIds=teams.filter(team=>!FOTMOB_LEAGUES[Number(team.leagueId)]&&favoriteIds.has(String(team.id)));
  const jobs=supported.map(async id=>{
    const data=await fotmobLeague(id);
    return data.matches.map(match=>fotmobFixture(match,id)).filter(fixture=>
      istanbulDate(fixture.fixture.date)===iso(new Date())&&
      (isFavoriteGoalTeam(fixture.teams.home)||isFavoriteGoalTeam(fixture.teams.away))
    );
  });
  if(unsupportedTeamIds.length&&HAS_API_KEY)
    jobs.push(af(`fixtures?date=${iso(new Date())}&timezone=Europe/Istanbul`).then(fixtures=>
      fixtures.filter(fixture=>isFavoriteGoalTeam(fixture.teams?.home||{})||isFavoriteGoalTeam(fixture.teams?.away||{}))
    ));
  if(!jobs.length)return [];
  const results=await Promise.allSettled(jobs);
  const fixtures=results.filter(result=>result.status==='fulfilled').flatMap(result=>result.value);
  if(!fixtures.length&&results.every(result=>result.status==='rejected'))
    throw new Error('Favori takımların maç skorları şu anda alınamadı.');
  return fixtures;
}

  if(!favoriteTeams.length)return title+'<p class="msg">Maç kartlarındaki yıldız düğmesine dokunarak takımları favorilerine ekle.</p>';
  if(S.favoriteBusy)return title+'<div class="sk"></div>'.repeat(3);
  return title+favoriteTeams.map(team=>{
    const games=S.favoriteGames[team.id]||{recent:[],upcoming:[]};
    return `<section class="fav-team-card"><div class="fav-team-head">${crest(team)}<strong>${esc(team.name)}</strong><button class="fav-remove" data-a="remove-fav-team" data-id="${esc(team.id)}">Favoriden çıkar</button></div>${games.error?`<p class="msg err">${esc(games.error)}</p>`:''}${gameList('Yaklaşan maçlar',games.upcoming)}${gameList('Son maçlar',games.recent)}</section>`;
  }).join('');
}
const crest=t=>t.logo?`<img class="cr" src="${esc(t.logo)}" alt="" loading="lazy">`:`<span class="cr" style="background:hsl(${[...t.name].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 40% 32%)" aria-hidden="true">${esc(t.name.slice(0,2).toUpperCase())}</span>`;
const mins=f=>f.fixture.status.short==='HT'?'D.A.':(f.fixture.status.elapsed!=null?f.fixture.status.elapsed+'’':'Canlı');
const teamLink=(team,league)=>`<button class="tap-team" data-a="team" data-id="${esc(team.id)}" data-name="${esc(team.name)}" data-logo="${esc(team.logo||'')}" data-lg="${league}">${crest(team)}<span>${esc(team.name)}</span></button>`;
function row(f,showFavorite=true,showDate=false){
  const sh=f.fixture.status.short,lv=LIVE.includes(sh),ns=NS.includes(sh),fin=DONE.includes(sh),h=f.goals.home,a=f.goals.away;
  const date=new Date(f.fixture.date),time=date.toLocaleTimeString('tr',{hour:'2-digit',minute:'2-digit'});
  const dateTime=showDate?`<span class="game-time"><span class="game-time-date">${esc(date.toLocaleDateString('tr',{day:'numeric',month:'short'}))}</span><span class="game-time-hour">${time}</span></span>`:time;
  const left=lv?`<b><span class="dot"></span>${mins(f)}</b>`:ns?dateTime:fin?'M.S.':esc(sh);
  const fv=isFav(f),T=f.teams;
  return `<article class="r ${lv?'lv':''}" data-a="fixture" data-id="${esc(f.fixture.id)}"><div class="match-meta"><div class="s">${left}</div>${showFavorite?`<button class="fv ${fv?'on':''}" data-a="fav" data-id="${esc(f.fixture.id)}" aria-label="${fv?'Favoriden çıkar':'Favoriye ekle'}" aria-pressed="${fv}">${svg(IC.s)}</button>`:''}</div><div class="matchup"><div class="team">${teamLink(T.home,f.league.id)}</div><div class="sc ${ns?'ns':''}">${ns?'VS':h+' : '+a}</div><div class="team">${teamLink(T.away,f.league.id)}</div></div></article>`;
}
function leagues(cls){

  return LG.map(([id,t])=>`<button class="chip ${S.lg===id?'on':''}" data-a="lg" data-v="${id}">${t}<i>${S.fx.length?cnt(id):''}</i></button>`).join('');

function table(rows,full,league=S.stl){

  const highlight=new Set(S.highlightTeams.map(normalizedTeam));
  return `<table><tr><th>#</th><th class="l">Takım</th><th>O</th>${full?'<th>G</th><th>B</th><th>M</th><th>AV</th>':''}<th>P</th></tr>${rows.map(r=>`<tr class="${highlight.has(normalizedTeam(r.team.name))?'match-highlight':''}"><td>${r.rank}</td><td class="l ${z(r.description)}"><button class="tap-team table-team" data-a="team" data-id="${esc(r.team.id)}" data-name="${esc(r.team.name)}" data-logo="${esc(r.team.logo||'')}" data-lg="${league}">${crest(r.team)}<span>${esc(r.team.name)}</span></button></td><td>${r.all.played}</td>${full?`<td>${r.all.win}</td><td>${r.all.draw}</td><td>${r.all.lose}</td><td>${r.goalsDiff}</td>`:''}<td><b>${r.points}</b></td></tr>`).join('')}</table>`;

const stName=()=>(LG.find(x=>x[0]===S.stl)||[0,'Puan Durumu'])[1];
function widget(full){
  const body=S.sterr?`<p class="err">${esc(S.sterr)}</p>`:S.st==null?'<p>Yükleniyor…</p>':!S.st.length?'<p>Puan durumu bulunamadı.</p>':`${full&&S.stLiveMatches.length?`<p class="msg"><span class="dot"></span> Canlı puan durumu · ${S.stLiveMatches.length} maçın mevcut skoru hesaba katıldı. Geçici tablodur; maç bitince kesinleşir.</p>`:''}${table(full?S.st:S.st.slice(0,8),full)}`;

function matches(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i-2);return d});
  let h=`<h1 class="page-title">Maç merkezi<span class="page-subtitle">Futbolun nabzı burada</span></h1><div class="seg" role="tablist"><button class="${S.sub==='t'?'on':''}" data-a="sub" data-v="t">Tüm maçlar</button><button class="${S.sub==='l'?'on':''}" data-a="sub" data-v="l">● Canlı</button><button class="${S.sub==='f'?'on':''}" data-a="sub" data-v="f">★ Favoriler</button></div>`;
  if(S.sub==='t')h+=`<div class="days">${days.map(d=>`<button class="chip ${iso(d)===S.date?'on':''}" data-a="date" data-v="${iso(d)}"><small>${d.toLocaleDateString('tr',{weekday:'short'})}</small>${d.getDate()}</button>`).join('')}</div>`;
  h+=`<div class="rail mob">${leagues()}</div>`;
  if(S.goalNotice)h+=`<div class="goal-notice" role="status">${esc(S.goalNotice)}</div>`;
  if(S.sourceWarning)h+=`<div class="source-note">${esc(S.sourceWarning)}</div>`;
  if(S.busy)return h+'<div class="sk"></div>'.repeat(5);
  if(S.err)return h+`<div class="msg err">${esc(S.err)}<br><button class="btn" data-a="reload">Tekrar dene</button></div>`;
  const list=S.fx.filter(f=>(!LIVE.includes(f.fixture.status.short)||FEATURED_LIVE_LEAGUES.has(Number(f.league.id)))&&(!S.lg||f.league.id===S.lg)&&(S.sub!=='f'||isFav(f)));
  if(!list.length)return h+`<div class="msg">${S.sub==='l'?'Önemli liglerde şu anda canlı maç yok.':S.sub==='f'?'Favori takımlarının bu tarihte maçı yok.':'Bu tarihte maç bulunamadı.'}</div>`;
  const fl=list.filter(isFav);
  if(fl.length)h+=`<section class="blk"><div class="bh">${svg(IC.s).replace('<svg','<svg style="color:var(--gd);width:18px;height:18px"')}Favori takımlarım</div>${fl.map(row).join('')}</section>`;
  const g={};list.filter(f=>!isFav(f)).forEach(f=>(g[f.league.id]??=[]).push(f));
  const ord=id=>{const i=LG.findIndex(x=>x[0]===id);return i<0?99:i};
  return h+Object.values(g).sort((a,b)=>ord(a[0].league.id)-ord(b[0].league.id)||a[0].league.name.localeCompare(b[0].league.name)).map(m=>{const l=m[0].league;
    return `<section class="blk"><div class="bh">${l.logo?`<img src="${esc(l.logo)}" alt="" loading="lazy">`:''}${esc(l.country?l.country+' · ':'')}${esc(l.name)}<span>${esc((l.round||'').replace('Regular Season - ','Hafta '))}</span></div>${m.map(row).join('')}</section>`}).join('');
}

function statusLabel(f){
  const status=f.fixture.status.short;
  if(LIVE.includes(status))return mins(f);
  if(DONE.includes(status))return 'Maç tamamlandı';
  return new Date(f.fixture.date).toLocaleString('tr',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
}
function detailHeader(title,subtitle){
  return `<div class="detail-head"><button class="detail-back" data-a="back">${svg('M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z')}Geri</button><h1 class="detail-title">${esc(title)}</h1><p class="detail-league">${esc(subtitle)}</p></div>`;
}
function matchTabsMarkup(){
  const tabs=[['summary','Özet'],['stats','İstatistik'],['lineup','Kadro'],['players','Oyuncu'],['commentary','Anlatım'],['h2h','H2H'],['table','Puan durumu'],['news','Haberler']];

function fixtureHero(f){
  const status=f.fixture.status.short,finished=DONE.includes(status)||status==='FT';
  const score=finished||LIVE.includes(status)?`${f.goals.home??0} : ${f.goals.away??0}`:'VS';
  const alertEnabled=matchAlerts.includes(String(f.fixture.id));
  return `<div class="hero-teams"><div class="hero-team">${teamLink(f.teams.home,f.league.id)}</div><div class="hero-score">${score}</div><div class="hero-team">${teamLink(f.teams.away,f.league.id)}</div></div><p class="hero-status">${esc(statusLabel(f))}</p><button class="match-alert-toggle" data-a="match-alert">${alertEnabled?'Maç bildirimlerini kapat':'Maç başlayınca ve bitince bildir'}</button>${S.matchAlertError?`<p class="msg err">${esc(S.matchAlertError)}</p>`:''}`;
}
function matchDetailPanel(f){

    (S.detailBusy&&S.matchTab==='summary'?'<div class="sk"></div>':'')+

function renderFixtureDetail(){
  if(S.detail?.kind!=='fixture'||S.playerDetail){render();return}

function fixturePage(){

    `<section class="hero-match">${fixtureHero(f)}</section>`+

function matchEvents(){
  const fotmob=S.matchFotmob?.content?.matchFacts?.events?.events;
  if(Array.isArray(fotmob))return fotmob.map(event=>({
    time:event.timeStr??event.time,
    type:event.type||'Olay',
    detail:cleanGoalDetail(event.card||event.goalDescription||event.detail||''),
    player:event.player?.name||event.nameStr||'',
    team:event.isHome?S.detail.fixture.teams.home.name:S.detail.fixture.teams.away.name,
    isHome:event.isHome===true||event.isHome===1,
    swap:event.swap||[],
    assist:eventAssistName(event.assistInput,event.goalDescription||event.detail||''),
    score:event.newScore?event.newScore.join('–'):'',
    raw:event
  })).sort((a,b)=>Number.parseInt(a.time,10)-Number.parseInt(b.time,10));
  const events=S.detail.fixture.detail?.events;
  return Array.isArray(events)?events.map(event=>({
    time:[event.time?.elapsed,event.time?.extra].filter(value=>value!=null).join('+'),
    type:event.type||'Olay',detail:cleanGoalDetail(event.detail||''),player:event.player?.name||'',
    team:event.team?.name||'',isHome:String(event.team?.id||'')===String(S.detail.fixture.teams.home.id)||
      (!event.team?.id&&normalizedTeam(event.team?.name)===normalizedTeam(S.detail.fixture.teams.home.name)),
    swap:[],assist:eventAssistName(event.assist?.name||event.assist,event.detail||''),score:'',raw:event
  })).sort((a,b)=>Number.parseInt(a.time,10)-Number.parseInt(b.time,10)):[];
}
function eventAssistName(value,description=''){
  const explicit=typeof value==='string'?value:value?.name||value?.fullName||value?.player?.name||'';
  const fromDescription=String(description||'').match(/(?:assist(?:ed by)?|asist(?:i| eden)?)\s*[:\-]\s*([^.;]+)/i)?.[1]||'';
  return String(explicit||fromDescription).trim().replace(/^(?:assist|asist)\s*[:\-]\s*/i,'');
}
function cleanGoalDetail(detail){
  return String(detail||'').replace(/(?:assist(?:ed by)?|asist(?:i| eden)?)\s*[:\-]\s*[^.;]+/ig,'').replace(/^[\s:;,.-]+|[\s:;,.-]+$/g,'').trim();
}
function translateMatchEventDetail(value){
  const text=String(value||'').trim();
  const key=text.toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
  const terms={'goal':'Gol','card':'Kart','yellow':'Sarı kart','yellow card':'Sarı kart','second yellow card':'İkinci sarı kart',
    'red':'Kırmızı kart','red card':'Kırmızı kart','substitution':'Oyuncu değişikliği','penalty':'Penaltı',
    'penalty goal':'Penaltı golü','missed penalty':'Kaçan penaltı','own goal':'Kendi kalesine gol',
    'var':'VAR incelemesi','var decision':'VAR kararı','injury time':'Uzatma dakikası','extra time':'Uzatma dakikası',
    'half':'İlk yarı','half time':'Devre arası','full time':'Maç sona erdi','match finished':'Maç sona erdi',
    'kick off':'Başlama vuruşu','kickoff':'Başlama vuruşu','offside':'Ofsayt','corner':'Korner',
    'yellow card given':'Sarı kart','red card given':'Kırmızı kart'};
  return terms[key]||text
    .replace(/\bYellow Card\b/gi,'Sarı kart').replace(/\bSecond Yellow\b/gi,'İkinci sarı kart')
    .replace(/\bRed Card\b/gi,'Kırmızı kart').replace(/\bOwn Goal\b/gi,'Kendi kalesine gol')
    .replace(/\bMissed Penalty\b/gi,'Kaçan penaltı').replace(/\bPenalty\b/gi,'Penaltı')
    .replace(/\bSubstitution\b/gi,'Oyuncu değişikliği').replace(/\bHalf Time\b/gi,'Devre arası')
    .replace(/\bFull Time\b/gi,'Maç sona erdi').replace(/\bOffside\b/gi,'Ofsayt')
    .replace(/\bInjury Time\b/gi,'Uzatma dakikası').replace(/\bCorner\b/gi,'Korner');
}
function matchEventLabel(event){
  const type=String(event.type||'').trim(),typeKey=type.toLowerCase();
  const minute=Number.parseInt(event.time,10);
  if(typeKey==='half'&&Number.isFinite(minute)&&minute>=90)return 'Maç sona erdi';
  if(['substitution','sub'].includes(typeKey)&&event.swap.length)return `Oyuncu değişikliği · ${event.swap.map(player=>player.name).join(' ↔ ')}`;
  if(typeKey==='goal')return event.player||`Gol${event.detail?` · ${translateMatchEventDetail(event.detail)}`:''}`;
  if(typeKey==='card')return `${translateMatchEventDetail(event.detail||'Kart')}${event.player?` · ${event.player}`:''}`;
  const types={'goal':'Gol','card':'Kart','substitution':'Oyuncu değişikliği','half':'İlk yarı','full time':'Maç sona erdi',
    'penalty':'Penaltı','var':'VAR incelemesi','kick off':'Başlama vuruşu','offside':'Ofsayt','corner':'Korner'};
  return [types[typeKey]||translateMatchEventDetail(type),translateMatchEventDetail(event.detail),event.player].filter(Boolean).join(' · ');
}
function matchEventList(events,limit=Infinity){
  if(!events.length)return '<p class="msg">Bu maç için anlatım verisi henüz yayımlanmamış.</p>';
  return `<div class="commentary-timeline">${events.slice(0,limit).map(event=>{
    const side=event.isHome?'home':'away',eventText=`${event.type||''} ${event.detail||''}`.toLowerCase(),kind=/goal|gol/.test(eventText)?'goal':/red|kırmızı/.test(eventText)?'card-red':/yellow|sarı|card|kart/.test(eventText)?'card-yellow':'';
    const label=matchEventLabel(event),isGoal=String(event.type||'').toLowerCase()==='goal';
    const scorer=event.player?`<button class="player-name-button" data-a="player" data-player-id="${esc(event.raw?.player?.id||'')}" data-player-name="${esc(event.player)}">${esc(event.player)}</button>`:esc(label);
    const goalDetail=event.detail?`<small>${esc(translateMatchEventDetail(event.detail))}</small>`:'';
    const assist=event.assist?`<small class="timeline-assist">Asist: ${esc(event.assist)}</small>`:'';
    const goalMarkup=isGoal?`<strong>${scorer} <span class="timeline-goal-score">${event.score?`(${esc(event.score)}) `:''}⚽</span></strong>${assist}${goalDetail}`:
      `<strong>${event.player?`<button class="player-name-button" data-a="player" data-player-id="${esc(event.raw?.player?.id||'')}" data-player-name="${esc(event.player)}">${esc(label)}</button>`:esc(label)}</strong><small>${esc(event.team)}</small>`;
    return `<div class="timeline-event ${side} ${kind}"><span class="timeline-event-time">${esc(event.time===''?'–':event.time)}′</span><div class="timeline-event-desc">${goalMarkup}</div></div>`;
  }).join('')}</div>`;
}
function momentumChart(){
  const data=S.matchFotmob?.content?.matchFacts?.momentum?.main?.data;
  if(!Array.isArray(data)||!data.length)return '';
  const bars=data.filter(point=>Number.isFinite(Number(point.minute))&&Number.isFinite(Number(point.value))).map(point=>{
    const minute=Math.max(0,Math.min(90,Number(point.minute))),value=Math.max(-100,Math.min(100,Number(point.value)));
    const height=Math.max(.35,Math.abs(value)*.19),x=minute/90*100,y=value>=0?20-height:20;
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="1.15" height="${height.toFixed(2)}" class="${value>=0?'momentum-home':'momentum-away'}"><title>${minute}′ · ${value>=0?S.detail.fixture.teams.home.name:S.detail.fixture.teams.away.name}</title></rect>`;
  }).join('');
  return bars?`<h3 class="match-section-title">Maç momentumu</h3><svg class="momentum-chart" viewBox="0 0 100 40" role="img" aria-label="Dakikalara göre maç momentumu"><line class="axis" x1="0" y1="1" x2="0" y2="39"/><line class="axis" x1="0" y1="39" x2="100" y2="39"/><line class="midline" x1="0" y1="20" x2="100" y2="20"/>${bars}</svg><div class="momentum-legend"><span>${esc(S.detail.fixture.teams.home.name)}</span><span>${esc(S.detail.fixture.teams.away.name)}</span></div>`:'';
}

}
function ratingBadge(value){
  if(value==null||value==='')return '<span class="rating-badge">–</span>';
  const score=Number(value),tone=!Number.isFinite(score)?'':score>=8?'rating-excellent':score>=7?'rating-good':score<6?'rating-low':'rating-mid';
  return `<span class="rating-badge ${tone}" aria-label="FotMob puanı ${esc(value)}">${esc(value)}</span>`;
}
function ratedMatchPlayers(){
  const data=S.matchFotmob?.content?.matchFacts?.topPlayers;
  const fixture=S.detail?.fixture;
  if(!fixture)return [];
  const players=[
    ...(data?.homeTopPlayers||[]).map(player=>({...player,team:fixture.teams.home})),
    ...(data?.awayTopPlayers||[]).map(player=>({...player,team:fixture.teams.away}))
  ].filter(player=>player.playerId&&player.name?.fullName);
  const knownIds=new Set(players.map(player=>String(player.playerId)));
  for(const player of Object.values(S.matchFotmob?.content?.playerStats||{})){
    const rating=player.stats?.find(group=>group.key==='top_stats')?.stats?.['FotMob rating']?.stat?.value;
    if(rating==null||!player.id||!player.name||knownIds.has(String(player.id)))continue;
    const team=String(player.teamId)===String(fixture.teams.home.id)?fixture.teams.home:
      String(player.teamId)===String(fixture.teams.away.id)?fixture.teams.away:null;
    if(!team)continue;

function fotmobMatchStats(){
  const periods=S.matchFotmob?.content?.stats?.Periods;
  const groups=periods?.All?.stats||[];
  if(!groups.length)return '';
  return groups.map(group=>{
    const stats=Array.isArray(group.stats)?group.stats:[];
    const rows=stats.filter(stat=>stat.type!=='title').map(stat=>{
      const pair=String(stat.stats||'').trim().match(/^(.+?)\s+([0-9][0-9.,]*(?:\s*\([^)]*\))?)$/);
      if(!pair)return '';
      const left=Number.parseFloat(pair[1].replace(',','.'))||0,right=Number.parseFloat(pair[2].replace(',','.'))||0,total=left+right,leftWidth=total?left/total*100:50;
      return `<div class="stat-row"><div class="stat-label">${esc(stat.title)}</div><div class="stat-values"><span>${esc(pair[1])}</span><div class="stat-track"><i style="width:${leftWidth}%"></i><i style="width:${100-leftWidth}%"></i></div><span>${esc(pair[2])}</span></div></div>`;
    }).join('');
    return rows?`<h3 class="match-section-title">${esc(group.title)}</h3>${rows}`:'';
  }).join('');
}
function matchShotMap(){
  const shots=S.matchFotmob?.content?.shotmap?.shots;
  if(!Array.isArray(shots)||!shots.length)return '';
  const fixture=S.detail.fixture,homeId=String(fixture.teams.home.id),awayId=String(fixture.teams.away.id);
  const hasNumber=value=>value!==null&&value!==''&&Number.isFinite(Number(value));
  const plot=shots.filter(shot=>hasNumber(shot.x)&&hasNumber(shot.y)&&
    Number(shot.x)>=0&&Number(shot.x)<=100&&Number(shot.y)>=0&&Number(shot.y)<=100&&
    [homeId,awayId].includes(String(shot.teamId)));
  if(!plot.length)return '';
  const totals=[homeId,awayId].map(teamId=>{
    const teamShots=plot.filter(shot=>String(shot.teamId)===teamId);
    const xg=teamShots.reduce((total,shot)=>total+(hasNumber(shot.expectedGoals)?Number(shot.expectedGoals):0),0);
    const hasXg=teamShots.some(shot=>hasNumber(shot.expectedGoals));
    const onTarget=teamShots.filter(shot=>shot.isOnTarget||shot.eventType==='Goal').length;
    return{teamId,team:teamId===homeId?fixture.teams.home:fixture.teams.away,shots:teamShots.length,onTarget,xg,hasXg};
  });
  const markers=plot.map((shot,index)=>{
    const teamId=String(shot.teamId),isHome=teamId===homeId,isGoal=shot.eventType==='Goal',onTarget=Boolean(shot.isOnTarget)||isGoal;
    const x=Number(shot.x),y=Number(shot.y)*.62,r=Math.max(1.45,Math.min(2.6,1.35+(Number(shot.expectedGoals)||0)*1.5));
    const minute=shot.min==null?'?':`${shot.min}${shot.minAdded?`+${shot.minAdded}`:''}`;
    const label=`${minute}′ · ${shot.playerName||'Şut'} · ${isGoal?'Gol':onTarget?'İsabetli':'İsabetsiz'} · xG ${hasNumber(shot.expectedGoals)?Number(shot.expectedGoals).toFixed(2):'–'}`;
    return `<circle class="${isGoal?'shot-goal':onTarget?(isHome?'shot-home':'shot-away'):`shot-off ${isHome?'shot-home':'shot-away'}`}" cx="${x}" cy="${y}" r="${r}" tabindex="0" data-a="player" data-player-id="${esc(shot.playerId||'')}" data-player-name="${esc(shot.playerName||'')}" aria-label="${esc(label)}"><title>${esc(label)}</title></circle>`;
  }).join('');
  const summary=totals.map(total=>`<div class="shot-xg-team"><strong>${esc(total.team.name)}</strong><b>${total.hasXg?total.xg.toFixed(2):'–'}</b><small>xG · ${total.shots} şut · ${total.onTarget} isabet</small></div>`).join('');
  return `<h3 class="match-section-title">Şut haritası</h3><div class="shot-xg">${summary}</div><svg class="shot-pitch" viewBox="0 0 100 62" role="img" aria-label="Maç şutlarının saha üzerindeki konumları"><rect class="field-line" x=".7" y=".7" width="98.6" height="60.6"/><path class="field-line" d="M50 1v60M0 15.5h16.5v31H0M100 15.5H83.5v31H100M0 23h5.5v16H0M100 23h-5.5v16h5.5"/><circle class="field-line" cx="50" cy="31" r="9.15"/><circle cx="50" cy="31" r=".7" fill="#ffffffbd"/>${markers}</svg><div class="shot-legend"><span><i class="shot-dot"></i>${esc(fixture.teams.home.name)}</span><span><i class="shot-dot away"></i>${esc(fixture.teams.away.name)}</span><span><i class="shot-dot goal"></i>Gol</span><span>Şut konumuna dokunarak oyuncu ve xG bilgisine bak</span></div>`;
}

async function loadPlayerCareer(player){
  if(!player.profileId){S.playerCareerLoading=false;S.playerCareerError='Bu oyuncu için FotMob kariyer profili eşleştirilemedi.';render();return}
  try{
    const response=await fetch(`https://appassets.androidplatform.net/proxy/fotmob/playerPage?playerId=${encodeURIComponent(player.profileId)}`);
    const html=await response.text();
    if(!response.ok)throw new Error(`Oyuncu kariyeri alınamadı (${response.status}).`);
    const documentHtml=new DOMParser().parseFromString(html,'text/html');
    const payload=documentHtml.getElementById('__NEXT_DATA__')?.textContent;
    if(!payload)throw new Error('Oyuncu kariyer verisi okunamadı.');
    const data=JSON.parse(payload)?.props?.pageProps?.data;
    if(!data||String(data.id)!==String(player.profileId))throw new Error('Oyuncu kariyer bilgisi eşleşmedi.');
    if(S.playerDetail!==player)return;
    const country=data.playerInformation?.find(item=>item.translationKey==='country_sentencecase'||item.title==='Country');
    player.country=country?.value?.fallback||player.country||'';
    player.countryCode=country?.countryCode||country?.icon?.id||player.countryCode||'';
    S.playerCareer=data;S.playerCareerError='';
  }catch(error){
    if(S.playerDetail!==player)return;
    S.playerCareerError=friendly(error.message);
  }
  if(S.playerDetail!==player)return;
  S.playerCareerLoading=false;
  render();
}
function openPlayerProfile(id,name=''){

  S.playerDetail=player;S.playerCareer=null;S.playerCareerError='';S.playerCareerLoading=Boolean(player.profileId);S.speechMessage='';
  history.pushState({aknsporPlayer:true},'',location.href);render();

function matchStatistics(statistics){

  const homeStats=home.statistics||[],awayStats=away.statistics||[];
  const awayByType=new Map(awayStats.map(item=>[item.type,item.value]));
  const selected=homeStats.filter(item=>item.value!=null&&awayByType.has(item.type));
  if(!selected.length)return '';
  const labels={'Ball Possession':'Topa sahip olma','Total Shots':'Toplam şut','Shots on Goal':'İsabetli şut','Shots off Goal':'İsabetsiz şut','Blocked Shots':'Engellenen şut','Corner Kicks':'Korner','Fouls':'Faul','Offsides':'Ofsayt','Yellow Cards':'Sarı kart','Red Cards':'Kırmızı kart','Goalkeeper Saves':'Kurtarış','Total passes':'Toplam pas','Passes accurate':'İsabetli pas','Passes %':'Pas yüzdesi','expected_goals':'Beklenen gol'};
  const rows=selected.map(item=>{
    const awayValue=awayByType.get(item.type),homeNumber=Number.parseFloat(String(item.value).replace('%',''))||0,awayNumber=Number.parseFloat(String(awayValue).replace('%',''))||0,total=homeNumber+awayNumber;
    const homeWidth=total?homeNumber/total*100:50;
    return `<div class="stat-row"><div class="stat-label">${esc(labels[item.type]||item.type)}</div><div class="stat-values"><span>${esc(item.value)}</span><div class="stat-track"><i style="width:${homeWidth}%"></i><i style="width:${100-homeWidth}%"></i></div><span>${esc(awayValue)}</span></div></div>`;
  }).join('');
  return `<div class="info-row"><span>${esc(home.team?.name||'Ev sahibi')}</span><span>${esc(away.team?.name||'Deplasman')}</span></div>${rows}`;
}

function lineupPlayerPerformance(player){
  const stats=Object.values(S.matchFotmob?.content?.playerStats||{}).find(item=>
    String(item.id)===String(player.id)||normalizedTeam(item.name)===normalizedTeam(player.name)
  );
  const apiPlayer=S.detail.fixture.detail?.players?.flatMap(team=>team.players||[]).find(item=>
    String(item.player?.id)===String(player.id)||normalizedTeam(item.player?.name)===normalizedTeam(player.name)
  );
  const apiStats=apiPlayer?.statistics?.[0]||{};
  const top=stats?.stats?.find(group=>group.key==='top_stats')?.stats||{};
  const numericStat=label=>{
    const value=top[label]?.stat?.value;
    if(value==null||value==='')return null;
    const number=Number(value);
    return Number.isFinite(number)?number:null;
  };
  const asNumber=value=>{
    if(value==null||value==='')return null;
    const number=Number(value);
    return Number.isFinite(number)?number:null;
  };
  const events=matchEvents(),samePlayer=event=>
    String(event.raw?.player?.id||'')===String(player.id)||normalizedTeam(event.player)===normalizedTeam(player.name);
  const goals=events.filter(event=>event.type==='Goal'&&samePlayer(event)).length;
  const assists=events.filter(event=>event.type==='Goal'&&normalizedTeam(event.assist)===normalizedTeam(player.name)).length;
  return{
    goals:numericStat('Goals')??asNumber(apiStats.goals?.total)??goals,
    assists:numericStat('Assists')??asNumber(apiStats.goals?.assists)??assists,
    rating:numericStat('FotMob rating')??asNumber(apiStats.games?.rating)??player.rating??null
  };
}
function averagePositionFor(player){
  const entries=S.matchHeatmap?.players;
  if(!entries||!player.id)return null;
  const id=String(player.id).replace(/^p/,'');
  const raw=entries[`p${id}`]||entries[id];
  if(typeof raw!=='string')return null;
  const points=Array.from(raw.matchAll(/<circle\b[^>]*>/g)).map(([circle])=>{
    const x=Number(circle.match(/\bcx="([0-9.]+)"/)?.[1]),y=Number(circle.match(/\bcy="([0-9.]+)"/)?.[1]);
    return Number.isFinite(x)&&Number.isFinite(y)?{x,y}:null;
  }).filter(Boolean);
  if(!points.length)return null;
  return{
    x:points.reduce((sum,point)=>sum+point.x,0)/points.length,
    y:points.reduce((sum,point)=>sum+point.y,0)/points.length
  };
}

  $('#right').innerHTML=!S.detail&&S.tab==='m'?widget(false):'';
  const lv=S.fx.filter(f=>LIVE.includes(f.fixture.status.short)&&FEATURED_LIVE_LEAGUES.has(Number(f.league.id)));
  $('#live').innerHTML=!S.detail&&S.tab==='m'&&lv.length?`<div class="live"><div class="lin"><div class="lh"><span class="dot"></span>Şu an oynanıyor (${lv.length})</div><div class="strip">${lv.map(f=>`<article class="lc" data-a="fixture" data-id="${esc(f.fixture.id)}"><small><span>${esc(f.league.name)}</span><b>${mins(f)}</b></small><div>${teamLink(f.teams.home,f.league.id)}<em>${f.goals.home??0}</em></div><div>${teamLink(f.teams.away,f.league.id)}<em>${f.goals.away??0}</em></div></article>`).join('')}</div></div></div>`:'';
  $('#back').classList.toggle('on',Boolean(S.detail));
  $('#brand').style.display=S.detail?'none':'block';
  $('#dn').innerHTML=NAV.map(([t,l])=>`<button class="${S.tab===t?'on':''}" data-a="tab" data-v="${t}">${l}</button>`).join('');
  $('#bn').innerHTML=NAV.map(([t,l])=>`<button class="${S.tab===t?'on':''}" data-a="tab" data-v="${t}" aria-current="${S.tab===t}">${svg(IC[t]||IC.s)}${l}</button>`).join('');
  renderedDetailKey=detailKey;
  scrollTo(0,S.detail&&!preserveDetailScroll?0:y);
}
function startPoll(){
  clearInterval(timer);
  timer=setInterval(async()=>{
    if(document.hidden)return;
    if(S.tab==='p'&&FOTMOB_LEAGUES[S.stl])loadStand(true);
    if(S.sub==='l'||(!goalAlerts&&S.fx.some(f=>LIVE.includes(f.fixture.status.short))))loadMatches(true);
  },LIVE_REFRESH_INTERVAL_MS)
  startFavoriteGoalPoll();
}
function matchTabChanged(tab){
  const fixture=S.detail?.kind==='fixture'?S.detail.fixture:null;
  if(!fixture)return;
  if(tab==='h2h'&&!S.matchH2h.length&&!S.matchH2hSummary&&!S.matchH2hLoading)loadHeadToHead(fixture);
  if(tab==='table'&&!S.matchTable&&!S.matchTableLoading)loadMatchTable(fixture);
  if(tab==='news'&&!S.matchNews.length&&!S.matchNewsLoading&&!S.matchNewsError)loadMatchNews(fixture);
}
window.addEventListener('popstate',()=>{
  if(S.playerDetail){S.playerDetail=null;render();return}
  if(S.detail){
    const previous=detailStack.pop();
    clearInterval(matchTimer);S.playerDetail=null;
    S.detail=previous?.detail||null;S.detailBusy=previous?.detailBusy||false;S.detailError=previous?.detailError||'';
    S.teamGames=previous?.teamGames||{recent:[],upcoming:[]};S.teamRecord=previous?.teamRecord||null;S.teamSquad=previous?.teamSquad||[];S.teamSquadError=previous?.teamSquadError||'';S.matchLineup=previous?.matchLineup||null;S.lineupLoading=previous?.lineupLoading||false;S.lineupError=previous?.lineupError||'';
    S.matchTab=previous?.matchTab||'summary';S.matchFotmob=previous?.matchFotmob||null;S.matchFotmobId=previous?.matchFotmobId||'';S.matchH2h=previous?.matchH2h||[];S.matchH2hSummary=previous?.matchH2hSummary||null;S.matchH2hLoading=previous?.matchH2hLoading||false;S.matchH2hError=previous?.matchH2hError||'';S.matchTable=previous?.matchTable||null;S.matchTableLoading=previous?.matchTableLoading||false;S.matchTableError=previous?.matchTableError||'';S.matchNews=previous?.matchNews||[];S.matchNewsLoading=previous?.matchNewsLoading||false;S.matchNewsError=previous?.matchNewsError||'';render();
    S.matchHeatmap=previous?.matchHeatmap||null;S.averagePositionMode=previous?.averagePositionMode||false;S.averagePositionIncludeSubs=previous?.averagePositionIncludeSubs||false;render();
    startMatchRefresh();
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='tab'){if(S.detail){S.detail=null;S.playerDetail=null;detailStack.length=0;clearInterval(matchTimer);history.replaceState(null,'',location.href)}S.tab=v;scrollTo(0,0);v==='m'?loadMatches():v==='f'?loadMyTeams():v==='p'&&S.st==null?loadStand():render()}
  else if(a==='back'){if(S.detail)history.back()}
  else if(a==='sub'){S.sub=v;S.tab='m';loadMatches()}
  else if(a==='date'){S.date=v;loadMatches()}
  else if(a==='lg'){S.lg=+v;if(S.lg&&S.lg!==S.stl){S.stl=S.lg;loadStand()}else render()}
  else if(a==='stl'){S.stl=+v;loadStand()}
  else if(a==='fav')toggleFav(b.dataset.id);
  else if(a==='team-fav'&&S.detail?.kind==='team')toggleTeamFavorite(S.detail.team,S.detail.leagueId);
  else if(a==='remove-fav-team')removeFavoriteTeam(b.dataset.id);
  else if(a==='match-tab'){
    S.matchTab=v;renderFixtureDetail();
    matchTabChanged(v);
  }
  else if(a==='average-mode'){S.averagePositionMode=v==='average';S.averagePositionIncludeSubs=false;renderFixtureDetail()}
  else if(a==='average-subs'){S.averagePositionIncludeSubs=v==='subs';renderFixtureDetail()}
  else if(a==='news-refresh'){const fixture=S.detail?.kind==='fixture'?S.detail.fixture:null;if(fixture)loadMatchNews(fixture)}
  else if(a==='news-link')window.AknSpor?.openNewsArticle?.(b.dataset.url||'');
  else if(a==='match-alert'){const fixture=S.detail?.kind==='fixture'?S.detail.fixture:null;if(fixture)toggleMatchAlert(fixture.fixture.id)}
  else if(a==='player')openPlayerProfile(b.dataset.playerId,b.dataset.playerName);
  else if(a==='speak-player')speakPlayerName();
  else if(a==='player-close'){if(S.playerDetail)history.back()}
  else if(a==='player-alert'){const player=S.playerDetail;if(player)togglePlayerAlert(player)}
  else if(a==='match-table'){
    const fixture=S.detail?.kind==='fixture'?S.detail.fixture:null;
    if(fixture){
      S.highlightTeams=[fixture.teams.home.name,fixture.teams.away.name];
      S.stl=LG.some(([id])=>id===fixture.league.id)?fixture.league.id:S.stl;
      S.detail=null;detailStack.length=0;history.replaceState(null,'',location.href);S.tab='p';loadStand();
    }
  }
  else if(a==='clear-highlight'){S.highlightTeams=[];render()}
  else if(a==='team')loadTeam({id:b.dataset.id,name:b.dataset.name,logo:b.dataset.logo},Number(b.dataset.lg));
  else if(a==='fixture')openFixture(b.dataset.id);
  else if(a==='reload')S.tab==='p'?loadStand():loadMatches();
});
document.addEventListener('change',e=>{const a=e.target.dataset.a;
  if(a==='theme'){theme=e.target.value;LS.set('theme',theme);applyTheme()}
  if(a==='goal-alert'){
    goalAlerts=e.target.checked;LS.set('goalAlerts',goalAlerts);
    syncBackgroundAlerts();
    startPoll();render();
  }});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.tab==='m')loadMatches(true)});
matchMedia('(prefers-color-scheme:light)').addEventListener('change',applyTheme);
applyTheme();syncBackgroundAlerts();startPoll();loadMatches();loadStand();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
